name: Deploy

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image (arm64 for the AWS box)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runner
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/partha607/n8e_survey:${{ github.ref_name }}
            ghcr.io/partha607/n8e_survey:latest

      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: migrate
          platforms: linux/arm64
          push: true
          tags: ghcr.io/partha607/n8e_survey:migrate-${{ github.ref_name }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /srv/n8e-collect
            APP_TAG=${{ github.ref_name }} ./deploy.sh
